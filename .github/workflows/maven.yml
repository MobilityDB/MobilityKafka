name: Maven CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    name: Build and test — Linux (Java 21 / Kafka Streams)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Derive the MEOS catalog (meos-idl.json via run.py) and build+install the
      # all-families libmeos.so (+ spatial_ref_sys.csv / ways1000.csv under
      # /usr/local/share) from upstream MobilityDB master through the shared
      # provision-meos action. Tracking master (not a pinned commit) keeps the
      # source, the catalog, the JMEOS jar and the libmeos the tests load all moving
      # together, so the generated facades can never drift from the surface they run
      # against. The JMEOS jar is then built from JMEOS main against this libmeos.
      - name: Provision MEOS catalog + libmeos
        id: provision
        uses: MobilityDB/MEOS-API/.github/actions/provision-meos@master
        with:
          mobilitydb-ref: master
          build-libmeos: "true"

      - name: Stage the derived MEOS catalog
        # codegen_jvm.py reads tools/meos-idl.json; place the derived catalog there.
        # The catalog is gitignored — it only ever exists as a build artifact.
        run: cp "${{ steps.provision.outputs.catalog-path }}" tools/meos-idl.json

      - name: Check out JMEOS
        uses: actions/checkout@v4
        with:
          repository: MobilityDB/JMEOS
          path: jmeos

      - name: Build + install the JMEOS jar as org.jmeos:meos:1.0
        # JMEOS's own tools/regen-from-catalog.sh is the single runnable definition of this
        # build — it stages the catalog and libmeos, and jmeos-core's generate-sources emits
        # GeneratedFunctions from the catalog. tools/refresh-from-master.sh reaches it through
        # the same script, so the CI path and the by-hand path cannot drift. Naming LIBMEOS
        # runs JMEOS's FFI suite against the libmeos this job just built, which is what tells a
        # jar that merely compiles from one whose generated surface answers.
        run: |
          CATALOG="${{ steps.provision.outputs.catalog-path }}" \
          LIBMEOS=/usr/local/lib/libmeos.so \
            jmeos/tools/regen-from-catalog.sh
          mvn -B install:install-file \
            -Dfile=jmeos/jar/JMEOS.jar \
            -DgroupId=org.jmeos -DartifactId=meos -Dversion=1.0 -Dpackaging=jar

      - name: Test the Kafka Streams app
        # The generated MeosOps* facades forward to the installed JMEOS jar; the tests exercise
        # them against libmeos from /usr/local/lib (surefire sets LD_LIBRARY_PATH=meos.lib.dir).
        run: mvn -B clean test
