name: Maven CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    name: Build and test — Linux (Java 21 / Kafka Streams)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Prefer apt.postgresql.org over the runner's preinstalled PostgreSQL so
      # the postgresql-server-dev package resolves cleanly. Only pg_config is
      # needed here — pgPointCloud produces a static libpc.a, no server.
      - name: Remove existing PostgreSQL installations [prefer apt.postgresql.org]
        run: |
          sudo service postgresql stop || true
          sudo apt-get --purge remove postgresql* -y || true
          sudo rm -rf /var/lib/postgresql/ /etc/postgresql/ \
            /var/log/postgresql/ || true

      - name: Add PostgreSQL APT repository
        run: |
          sudo apt-get install -y curl ca-certificates gnupg
          curl https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo apt-key add -
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt/ \
            $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'

      - name: Install MEOS build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake build-essential \
            libjson-c-dev libgeos-dev libproj-dev libgsl-dev \
            libh3-dev libgdal-dev libxml2-dev \
            autoconf automake libtool pkg-config \
            postgresql-17 postgresql-server-dev-17

      - name: Build libmeos.so + JMEOS.jar from the tracked commit
        # build-jmeos.sh builds libmeos from the recorded MobilityDB commit, builds the
        # JMEOS jar from JMEOS main, installs the jar into the local Maven repo, and stages
        # libmeos.so under kafka-streams-app/lib. MOBILITYDB_REF is read from the single
        # recorded surface commit so no SHA is duplicated in this workflow.
        run: MOBILITYDB_REF="$(tr -d '[:space:]' < tools/meos-source-commit.txt)" JOBS=2 ./build-jmeos.sh

      - name: Test the Kafka Streams app
        # The generated MeosOps* facades forward to the installed JMEOS jar; the tests
        # exercise them against the freshly built libmeos, resolved via LD_LIBRARY_PATH.
        working-directory: kafka-streams-app
        run: LD_LIBRARY_PATH="$PWD/lib" mvn -B test
